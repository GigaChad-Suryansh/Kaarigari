<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaarigari — Phone Login</title><link rel="stylesheet" href="motion.css"><style>:root{--cream:#f7f1e4;--paper:#fffaf1;--ink:#2b211b;--muted:#786e64;--rust:#a45b3f;--blue:#3e4e82;--line:#d9cdbb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.shell{width:min(520px,100%)}.brand{text-align:center;font:700 42px Georgia,serif}.tag{text-align:center;color:var(--rust);font-size:11px;font-weight:800;letter-spacing:3px;margin:7px 0 25px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 22px 65px #2b211b18}.ey{color:var(--rust);font-size:11px;font-weight:800;letter-spacing:2px}.card h1{font:500 36px/1.1 Georgia,serif;margin:10px 0}.muted{color:var(--muted);line-height:1.5}.field{margin-top:18px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fffdf8;font-size:16px}.btn{width:100%;margin-top:18px;border:0;background:var(--rust);color:#fff;padding:14px 18px;border-radius:25px;cursor:pointer;font-weight:700;font-size:15px}.btn:disabled{opacity:.55;cursor:not-allowed}.back{background:transparent;color:var(--ink);border:1px solid var(--line)}.otp{display:none}.status{margin-top:15px;padding:12px;border-radius:10px;background:#efe5d6;font-size:13px}.status.ok{background:#e3eee5;color:#55745d}.hint{font-size:12px;color:var(--muted);margin-top:10px}@media(max-width:480px){.card{padding:25px}.card h1{font-size:31px}}</style></head><body><main class="shell"><div class="brand">कारीgari</div><div class="tag">MADE WITH A VOICE</div><section class="card section-enter"><div class="ey" id="roleEy">SECURE SIGN IN</div><h1 id="title">Continue as a Customer</h1><p class="muted">Sign in with your mobile number. We'll send a one-time password to continue.</p><div id="phoneStep"><div class="field"><label>Mobile number</label><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel"></div><button id="send" class="btn" onclick="sendOtp()">Send OTP →</button><button class="btn back" onclick="location.href='index.html'">← Back</button></div><div id="otpStep" class="otp"><div class="field"><label>Enter 6-digit OTP</label><input id="code" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code"></div><button id="verify" class="btn" onclick="verifyOtp()">Verify & Continue →</button><button class="btn back" onclick="backToPhone()">← Change number</button><div class="hint" id="hint"></div></div><div id="status" class="status" style="display:none"></div></section></main><script>const API=window.KAARIGARI_API||((location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://localhost:8000/api':'https://kaarigari.onrender.com/api');const params=new URLSearchParams(location.search);const role=params.get('role')==='artisan'?'artisan':'customer';const destination=role==='artisan'?'artisan.html':'customer.html';const $=id=>document.getElementById(id);$('title').textContent=role==='artisan'?'Continue as an Artisan':'Continue as a Customer';$('roleEy').textContent=role==='artisan'?'ARTISAN SIGN IN':'CUSTOMER SIGN IN';function status(msg,ok=false){$('status').style.display='block';$('status').className='status'+(ok?' ok':'');$('status').textContent=msg}function cleanPhone(){return $('phone').value.replace(/\D/g,'').slice(0,10)}async function sendOtp(){const phone=cleanPhone();$('phone').value=phone;if(phone.length!==10)return status('Enter a valid 10-digit Indian mobile number.');const b=$('send');b.disabled=true;b.textContent='Sending OTP…';try{const r=await fetch(API+'/auth/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,role})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not send OTP');sessionStorage.setItem('kaarigari_phone',phone);sessionStorage.setItem('kaarigari_role',role);$('phoneStep').style.display='none';$('otpStep').style.display='block';$('hint').textContent=d.demo?'Demo mode: any 6-digit OTP works.':'OTP sent to your mobile number.';status(d.message||'OTP sent.',true);$('code').focus()}catch(e){status(e.message||'Could not send OTP')}finally{b.disabled=false;b.textContent='Send OTP →'}}async function verifyOtp(){const phone=sessionStorage.getItem('kaarigari_phone')||cleanPhone(),code=$('code').value.replace(/\D/g,'').slice(0,6);$('code').value=code;if(phone.length!==10||code.length!==6)return status('Enter the 6-digit OTP.');const b=$('verify');b.disabled=true;b.textContent='Verifying…';try{const r=await fetch(API+'/auth/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,otp:code,role})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Invalid OTP');sessionStorage.setItem('kaarigari_token',d.token||'');sessionStorage.setItem('kaarigari_role',role);sessionStorage.setItem('kaarigari_logged_in','true');status('Verified. Opening your Kaarigari experience…',true);setTimeout(()=>location.href=destination,250)}catch(e){status(e.message||'Verification failed')}finally{b.disabled=false;b.textContent='Verify & Continue →'}}function backToPhone(){$('otpStep').style.display='none';$('phoneStep').style.display='block';$('status').style.display='none';$('phone').focus()}$('phone').addEventListener('input',()=>{$('phone').value=cleanPhone()});$('code').addEventListener('input',()=>{$('code').value=$('code').value.replace(/\D/g,'').slice(0,6)});</script></body></html>
