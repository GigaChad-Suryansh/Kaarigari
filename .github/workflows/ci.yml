name: Kaarigari CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: node --check server.js
      - run: npm start > /tmp/kaarigari.log 2>&1 & pid=$!; sleep 2; curl --fail http://127.0.0.1:8000/api/health; kill $pid
