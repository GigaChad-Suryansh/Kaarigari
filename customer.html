<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaarigari — Customer</title><style>body{margin:0;background:#f7f1e4;color:#2b211b;font-family:Arial}.wrap{max-width:1100px;margin:auto;padding:28px}.hero{padding:55px 28px}.brand,h1,h2{font-family:Georgia,serif}.brand{font-size:32px}.ey{color:#a45b3f;font-weight:800;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:#fffaf1;padding:14px}.card img{width:100%;height:240px;object-fit:cover}.price{font-weight:800;font-size:20px}.btn{border:0;background:#a45b3f;color:white;padding:12px 18px;border-radius:6px}.cart{position:fixed;right:20px;bottom:20px;background:#3e4e82;color:white;padding:16px;border-radius:30px;border:0}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="brand">कारीगारी</div><div class="ey">MADE WITH A VOICE</div><section class="hero"><div class="ey">A MARKETPLACE WITH A HEARTBEAT</div><h1>Find something made by hand.</h1><p>Thoughtful objects, honest stories, and the people who make them.</p><input id="q" placeholder="Search crafts..." style="padding:14px;width:70%;border:0;border-bottom:1px solid #2b211b;background:transparent" oninput="render()"></section><div id="grid" class="grid"></div></div><button class="cart" onclick="alert('Demo cart: '+cart.length+' item(s)')">🛍 Cart <span id="n">0</span></button><script>const p=[['Indigo Bloom Handblock Dupatta','Textiles','Jaipur, Rajasthan','₹1,890','https://images.unsplash.com/photo-1610701596007-11502861dcfa?auto=format&fit=crop&w=700&q=80'],['Terracotta Matka Set','Pottery','Khurja, Uttar Pradesh','₹1,450','https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?auto=format&fit=crop&w=700&q=80'],['Sunset Cane Basket','Baskets','Assam','₹980','https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=700&q=80'],['Kutch Mirrorwork Cushion','Textiles','Bhuj, Gujarat','₹1,240','https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?auto=format&fit=crop&w=700&q=80'],['Blue Pottery Serving Bowl','Pottery','Jaipur, Rajasthan','₹760','https://images.unsplash.com/photo-1610701596007-11502861dcfa?auto=format&fit=crop&w=700&q=80'],['Bamboo Weave Tote','Baskets','Tripura','₹1,050','https://images.unsplash.com/photo-1594223274512-ad4803739b7c?auto=format&fit=crop&w=700&q=80']];let cart=[];function render(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('grid').innerHTML=p.filter(x=>x.join(' ').toLowerCase().includes(q)).map((x,i)=>`<article class="card"><img src="${x[4]}"><div class="ey">${x[1]}</div><h2>${x[0]}</h2><p>${x[2]}</p><div class="price">${x[3]}</div><button class="btn" onclick="cart.push(${i});document.getElementById('n').textContent=cart.length">Add to cart</button></article>`).join('')}render()</script></body></html>
