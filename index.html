<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaarigari — Made with a Voice</title><style>:root{--cream:#f7f1e4;--paper:#fffaf1;--ink:#2b211b;--muted:#786e64;--rust:#a45b3f;--gold:#cda84f;--blue:#3e4e82;--line:#d9cdbb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;display:grid;place-items:center}.brand{font:700 42px Georgia,serif;text-align:center}.tag{color:var(--rust);font-size:11px;font-weight:800;letter-spacing:3px;text-align:center;margin-top:7px}.overlay{position:fixed;inset:0;background:#2b211bcc;display:grid;place-items:center;padding:20px}.modal{width:min(620px,100%);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:42px;box-shadow:0 25px 80px #0005;text-align:center}.ey{color:var(--rust);font-size:11px;font-weight:800;letter-spacing:2px}.modal h1{font:500 42px/1.05 Georgia,serif;margin:12px 0}.modal p{color:var(--muted);font-size:17px;line-height:1.5}.roles{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:28px}.role{border:1px solid var(--line);background:transparent;border-radius:10px;padding:24px;text-align:left;cursor:pointer;color:var(--ink);transition:.18s}.role:hover{transform:translateY(-3px);border-color:var(--rust);box-shadow:0 8px 25px #0001}.role .icon{font-size:30px}.role strong{display:block;font:700 23px Georgia,serif;margin:10px 0 6px}.role span{color:var(--muted);font-size:14px}.foot{margin-top:25px;font-size:12px;color:var(--muted)}@media(max-width:560px){.modal{padding:30px 20px}.modal h1{font-size:34px}.roles{grid-template-columns:1fr}}</style></head><body><div><div class="brand">कारीगारी</div><div class="tag">MADE WITH A VOICE</div></div><div class="overlay"><div class="modal"><div class="ey">WELCOME TO KAARIGARI</div><h1>How would you like to begin?</h1><p>Choose your experience — discover handmade crafts or grow your craft business with your voice.</p><div class="roles"><button class="role" onclick="location.href='customer.html'"><div class="icon">🛍️</div><strong>I am a Customer</strong><span>Discover handmade objects, stories and makers.</span></button><button class="role" onclick="location.href='artisan.html'"><div class="icon">👋</div><strong>I am an Artisan</strong><span>Sell your craft, create listings and manage your business.</span></button></div><div class="foot">Your choice opens the dedicated Kaarigari experience.</div></div></div></body></html>
